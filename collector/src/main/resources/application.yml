spring:
  application:
    name: collector
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_radar}
    username: ${DB_USER:job_radar}
    password: ${DB_PASSWORD:job_radar}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    template:
      # KafkaTemplate 是自動組態的（沒有手動 ProducerFactory bean），這個屬性讓它自動
      # 產生 producer span 並把 W3C traceparent 塞進訊息 header，consumer 端才能接得起來
      observation-enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      # 100% 取樣是這個規模（單機、低流量）的特例，不可外推到生產環境，見
      # add-distributed-tracing/design.md
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

collector:
  scan:
    tick-interval-millis: 300000
    jitter-seconds: 300
    user-agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 job-radar/0.1"
    request-interval-millis: 1000
    # 台灣時間活躍掃描時段（24 小時制，含頭不含尾），避開半夜這種不自然的流量模式，
    # 降低被平台判定為機器人的風險（見 ScanScheduler 的說明）
    active-hours-start: 8
    active-hours-end: 23
    # 全域預設，取代原本逐字重複在各 ListScraper 裡的常數（見 architecture.md D23）
    max-retry: 3
    max-scan-duration-minutes: 15
    retry-backoff-base-millis: 2000
    # 淺掃/深掃合併邏輯用（見 architecture.md D6）
    deep-scan-interval-hours: 24
    deep-scan-max-duration-minutes: 45
    # per-source 覆寫（見 architecture.md D19/D23）：104 有 Cloudflare，翻頁間隔要比
    # Yourator/CakeResume 的固定 1 秒更保守，改用 3–10 秒隨機區間
    sources:
      "104":
        request-interval-min-millis: 3000
        request-interval-max-millis: 10000
