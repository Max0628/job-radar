spring:
  application:
    name: worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_radar}
    username: ${DB_USER:job_radar}
    password: ${DB_PASSWORD:job_radar}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.jobradar.common.envelope
    template:
      # KafkaTemplate 是自動組態的（沒有手動 ProducerFactory bean），這個屬性讓它自動
      # 產生 producer span 並把 W3C traceparent 塞進訊息 header。consumer 端的
      # observation 是手動開的，見 KafkaConsumerConfig.buildFactory()——這裡的
      # spring.kafka.consumer.* 對實際 consumer 完全不生效（container factory 是手動
      # 建立的，繞過 Spring Boot 的自動組態，是既有的已知狀況，不在本次變更範圍內）
      observation-enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

worker:
  fetcher:
    user-agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 job-radar/0.1"
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

resilience4j:
  retry:
    instances:
      yourator:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
